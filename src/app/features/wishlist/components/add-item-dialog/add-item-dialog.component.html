<p-dialog
   header="Add new item"
   [modal]="true"
   [(visible)]="visible"
   (onShow)="initDialog()"
   (onHide)="handleCloseDialog()"
   [style]="{ width: 'min(50rem, 95vw)', height: 'min(80vh, 720px)' }"
   [contentStyle]="{ padding: '0', overflow: 'auto' }"
>
   <form
      [formGroup]="newItemFormGroup"
      class="flex flex-col gap-4 p-5"
   >
      <!-- Name + Location -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
         <div class="flex flex-col gap-1.5">
            <label
               for="name"
               class="text-sm font-medium text-surface-600 dark:text-surface-300"
            >
               Name
            </label>
            <input
               pInputText
               id="name"
               formControlName="name"
               placeholder="Es. Vintage lamp"
               class="w-full"
            />
         </div>
         <div class="flex flex-col gap-1.5">
            <label
               for="location"
               class="text-sm font-medium text-surface-600 dark:text-surface-300"
            >
               Location
            </label>
            <input
               pInputText
               id="location"
               formControlName="location"
               placeholder="Es. Milano"
               class="w-full"
            />
         </div>
      </div>

      <!-- Image URL -->
      <div class="flex flex-col gap-1.5">
         <label
            for="imageURL"
            class="text-sm font-medium text-surface-600 dark:text-surface-300"
         >
            Image URL
         </label>
         <input
            pInputText
            id="imageURL"
            formControlName="imageURL"
            placeholder="https://..."
            class="w-full"
         />
      </div>

      <!-- Anteprima immagine -->
      @if (newItemFormGroup.value.imageURL) {
         <div class="rounded-lg overflow-hidden border border-surface-200 dark:border-surface-700 max-h-44">
            <img
               [src]="newItemFormGroup.value.imageURL"
               alt="Preview"
               class="w-full h-full object-cover"
            />
         </div>
      }

      <!-- Description -->
      <div class="flex flex-col gap-1.5">
         <label class="text-sm font-medium text-surface-600 dark:text-surface-300"> Description </label>
         <textarea
            rows="3"
            pTextarea
            formControlName="description"
            placeholder="Descrivi l'oggetto..."
            class="w-full resize-none"
         ></textarea>
      </div>

      <!-- Price range -->
      <div class="flex flex-col gap-2">
         <label class="text-sm font-medium text-surface-600 dark:text-surface-300">
            Price range
            <span class="font-normal text-surface-400">(€)</span>
         </label>
         <div class="grid grid-cols-[1fr_auto_1fr] items-end gap-2">
            <div class="flex flex-col gap-1">
               <span class="text-xs uppercase tracking-wide text-surface-400">Min</span>
               <p-inputnumber
                  formControlName="minPrice"
                  [min]="0"
                  [max]="newItemFormGroup.value.maxPrice"
                  inputStyleClass="w-full h-10 px-3 border rounded-md border-surface-300 dark:border-surface-600"
                  class="w-full"
               />
            </div>
            <span class="text-surface-400 pb-2.5">–</span>
            <div class="flex flex-col gap-1">
               <span class="text-xs uppercase tracking-wide text-surface-400">Max</span>
               <p-inputnumber
                  formControlName="maxPrice"
                  [min]="newItemFormGroup.value.minPrice"
                  inputStyleClass="w-full h-10 px-3 border rounded-md border-surface-300 dark:border-surface-600"
                  class="w-full"
               />
            </div>
         </div>
      </div>
   </form>

   <ng-template #footer>
      <div class="flex justify-end items-center gap-2 px-5 py-3">
         <p-button
            variant="text"
            severity="secondary"
            label="Cancel"
            (click)="visible = false"
         />
         <p-button
            icon="pi pi-plus"
            label="Add item"
            (click)="handleSaveItem()"
         />
      </div>
   </ng-template>
</p-dialog>

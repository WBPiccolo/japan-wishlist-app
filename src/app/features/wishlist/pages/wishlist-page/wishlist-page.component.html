<div class="flex flex-row items-center justify-start gap-4 px-2 py-4">
   <div class="flex items-center gap-2">Admin Mode <p-toggleswitch [(ngModel)]="isAdminMode" /></div>
   @if (isAdminMode) {
      <p-button
         icon="pi pi-plus"
         label="Add new item"
         (click)="openAddItemDialog()"
      ></p-button>
      <div>
         <p-checkbox
            inputId="recieveNotifications"
            [(ngModel)]="reciveNotifications"
            [binary]="true"
            (onChange)="handleNotificationsPermissions($event)"
         />
         <label for="recieveNotifications"> Ricevi Notifiche </label>
      </div>
   }
   <div>Totale da dare a Fede: {{ wishlistTotalSpent$ | async | currency: 'EUR' }}</div>
</div>

<div class="grid grid-cols-[repeat(auto-fill,minmax(280px,1fr))] gap-4">
   @for (item of wishlistObs$ | async; track $index) {
      @if (isAdminMode || !hideDeleted || !item.isDeleted) {
         <app-wishlist-item
            class="h-[420px] cursor-pointer"
            [canDelete]="isAdminMode"
            [item]="item"
            (itemClicked)="handleItemClick(item)"
            (deleteItemClicked)="handleDeleteItem(item)"
            (restoreItemClicked)="handleRestoreItem(item)"
         ></app-wishlist-item>
      }
   }
</div>
<app-update-item-dialog
   [visible]="showUpdateItemDialog"
   [itemToUpdate]="itemToUpdate"
   (closeDialog)="handleCloseUpdateItemDialog()"
   (itemBought)="handleItemBought($event)"
   (undoBought)="handleResetItemStatus()"
></app-update-item-dialog>

<app-add-item-dialog
   [visible]="showAddItemDialog"
   (closeDialog)="handleCloseAddItemDialog()"
   (saveItem)="saveNewItem($event)"
></app-add-item-dialog>

<p-toast />
<p-confirmdialog />
